apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fortress-in-a-box
  namespace: argocd
  # Never delete this app, even if its file disappears from Git
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  project: default
  source:
    repoURL: https://github.com/JoseLorenzana272/fortress-in-a-box
    targetRevision: v2.0.0
    path: k8s
    directory:
      recurse: true
      # Only these files - anything new under k8s/ is ignored
      include: '{policies/*.yaml,argocd/fortress-app.yaml,argocd/user-project.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true