apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fortress-in-a-box
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JoseLorenzana272/fortress-in-a-box
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true