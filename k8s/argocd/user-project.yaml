apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: fortress-user-workloads
  namespace: argocd
spec:
  description: "User applications. Cannot deploy into platform namespaces or change cluster-wide security."
  # Allow any repo - destinations and resources below are the real limits
  sourceRepos:
    - "*"
  # Block platform namespaces - "!" entries win over "*"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "!kube-system"
    - server: https://kubernetes.default.svc
      namespace: "!kube-public"
    - server: https://kubernetes.default.svc
      namespace: "!kube-node-lease"
    - server: https://kubernetes.default.svc
      namespace: "!argocd"
    - server: https://kubernetes.default.svc
      namespace: "!monitoring"
    - server: https://kubernetes.default.svc
      namespace: "!falco"
    - server: https://kubernetes.default.svc
      namespace: "!kyverno"
    - server: https://kubernetes.default.svc
      namespace: "*"
  # Only allow Namespace (needed by CreateNamespace=true)
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  # Block Kyverno and Argo objects from user repos
  namespaceResourceBlacklist:
    - group: kyverno.io
      kind: "*"
    - group: policies.kyverno.io
      kind: "*"
    - group: argoproj.io
      kind: "*"
