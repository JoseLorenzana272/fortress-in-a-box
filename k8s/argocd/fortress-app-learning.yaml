apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fortress-in-a-box
  namespace: argocd
  # Never delete this app, even if its file disappears from Git
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  project: default
  source:
    repoURL: https://github.com/JoseLorenzana272/fortress-in-a-box
    targetRevision: HEAD
    # No source type set: Argo CD finds k8s/kustomization.yaml and builds learning mode from it.
    # Do not add "kustomize: {}" - Kubernetes drops empty fields and the app would never be in sync.
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
