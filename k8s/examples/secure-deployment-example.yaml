# ============================================================
# FORTRESS IN A BOX - Secure Deployment Example
# ============================================================
# Use this as a template for deploying your application.
#
# This deployment is hardened to pass the 8 Kyverno policies that apply to
# deployments (the 9th, disallow-insecure-ephemeral-containers, only applies
# to kubectl debug):
#   - disallow-root-user
#   - disallow-privileged-containers
#   - disallow-latest-tag (handled automatically by CI/CD)
#   - require-resource-limits
#   - require-readonly-rootfs
#   - disallow-host-network
#   - disallow-host-namespaces
#   - disallow-capabilities-and-escalation
#
# IMPORTANT: The image tag is automatically updated by the
# CI/CD pipeline on every push. Do not change it manually.
# If your app needs to write to disk, add emptyDir volumes
# for the specific paths it needs (see volumeMounts below).
# ============================================================


apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortress-app
  namespace: default
  labels:
    app: fortress-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fortress-app
  template:
    metadata:
      labels:
        app: fortress-app
    spec:
      # Pod level - not root, no host network/PID/IPC
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: secure-nginx
          # This tag is automatically updated by the CI/CD pipeline on every push.
          # Never change this manually — let the pipeline handle it.
          # Format: ghcr.io/<your-org>/<your-repo>:<git-sha>
          image: ghcr.io/joselorenzana272/fortress-in-a-box:3ab0ff7cc2981ecddf8ea8e0112682aa0031b2a3
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          # Container level security
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            privileged: false                # disallow-privileged-containers
            readOnlyRootFilesystem: true     # require-readonly-rootfs
          # Resource limits - disallow resource exhaustion attacks
          resources:
            limits:
              cpu: "200m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          # nginx needs to write to these paths at runtime
          # emptyDir gives it a safe writable scratch space
          # while the root filesystem stays locked
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}