apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fortress-kyverno-read-argo-apps
  # Kyverno adds these permissions to its admission controller
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
# Read only - exceptions check which project an Argo CD app belongs to
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get"]
