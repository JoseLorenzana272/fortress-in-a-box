apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-limits
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: exclude-system-namespaces
      expression: "request.namespace != 'falco' && request.namespace != 'monitoring' && request.namespace != 'kyverno' && request.namespace != 'argocd' && !request.namespace.startsWith('gke-managed-') && request.namespace != 'gmp-system' && request.namespace != 'gmp-public'"
  variables:
    - name: allContainers
      expression: "object.spec.containers + object.spec.?initContainers.orValue([])"
    - name: failing
      expression: >
        variables.allContainers.filter(c, !(c.?resources.?limits.?cpu.hasValue() && c.?resources.?limits.?memory.hasValue()))
  validations:
    - expression: "size(variables.failing) == 0"
      message: "FORTRESS SECURITY: Set resources.limits.cpu and resources.limits.memory on every container."
      messageExpression: >
        (size(variables.failing) == 1 ? 'FORTRESS SECURITY: Container "' : 'FORTRESS SECURITY: Containers "') +
        variables.failing.map(c, c.name).join('", "') +
        '" must set resources.limits.cpu and resources.limits.memory.'
