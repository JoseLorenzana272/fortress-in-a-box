apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: exclude-system-namespaces
      expression: "request.namespace != 'falco' && request.namespace != 'monitoring' && request.namespace != 'kyverno' && request.namespace != 'argocd'"
  variables:
    - name: allContainers
      expression: "object.spec.containers + object.spec.?initContainers.orValue([])"
    - name: failing
      expression: >
        variables.allContainers.filter(c, !((c.image.matches('^.+:[^/:@]+$') && !c.image.endsWith(':latest')) || c.image.matches('^.+@sha256:[a-fA-F0-9]{64}$')))
  validations:
    - expression: "size(variables.failing) == 0"
      message: "FORTRESS SECURITY: Images must use a pinned version (like nginx:1.27) or a sha256 digest, not :latest or no tag."
      messageExpression: >
        (size(variables.failing) == 1 ? 'FORTRESS SECURITY: Container "' : 'FORTRESS SECURITY: Containers "') +
        variables.failing.map(c, c.name).join('", "') +
        '" must use a pinned image version (like nginx:1.27) or a sha256 digest, not :latest or no tag.'
