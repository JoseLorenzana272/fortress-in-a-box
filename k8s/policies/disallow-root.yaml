apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-root-user
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: exclude-namespaces
      expression: "request.namespace != 'falco' && request.namespace != 'monitoring' && request.namespace != 'kyverno' && request.namespace != 'argocd'"
  variables:
    - name: allContainers
      expression: "object.spec.containers + object.spec.?initContainers.orValue([])"
    # Containers inherit runAsNonRoot from the pod unless they set their own
    - name: podNonRoot
      expression: "object.spec.?securityContext.?runAsNonRoot.orValue(false)"
    - name: failing
      expression: >
        variables.allContainers.filter(c, c.?securityContext.?runAsNonRoot.orValue(variables.podNonRoot) != true)
  validations:
    - expression: "size(variables.failing) == 0"
      message: "FORTRESS SECURITY: Containers must not run as root. Set securityContext.runAsNonRoot: true on the pod (or on each container)."
      messageExpression: >
        (size(variables.failing) == 1 ? 'FORTRESS SECURITY: Container "' : 'FORTRESS SECURITY: Containers "') +
        variables.failing.map(c, c.name).join('", "') +
        '" must not run as root. Set securityContext.runAsNonRoot: true on the pod (or on each container).'
