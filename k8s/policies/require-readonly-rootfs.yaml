apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-readonly-rootfs
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: exclude-system-namespaces
      expression: "request.namespace != 'falco' && request.namespace != 'monitoring' && request.namespace != 'kyverno' && request.namespace != 'argocd'"
  variables:
    - name: allContainers
      expression: "object.spec.containers + object.spec.?initContainers.orValue([])"
    - name: failing
      expression: >
        variables.allContainers.filter(c, c.?securityContext.?readOnlyRootFilesystem.orValue(false) != true)
  validations:
    - expression: "size(variables.failing) == 0"
      message: "FORTRESS SECURITY: Set securityContext.readOnlyRootFilesystem: true. If the app writes files, mount an emptyDir for those paths."
      messageExpression: >
        (size(variables.failing) == 1 ? 'FORTRESS SECURITY: Container "' : 'FORTRESS SECURITY: Containers "') +
        variables.failing.map(c, c.name).join('", "') +
        '" must set securityContext.readOnlyRootFilesystem: true. If the app writes files, mount an emptyDir for those paths.'
