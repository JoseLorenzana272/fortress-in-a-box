apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-capabilities-and-escalation
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: exclude-system-namespaces
      expression: "request.namespace != 'falco' && request.namespace != 'monitoring' && request.namespace != 'kyverno' && request.namespace != 'argocd'"
  # Debug containers (kubectl debug) are checked in disallow-insecure-ephemeral-containers
  variables:
    - name: allContainers
      expression: "object.spec.containers + object.spec.?initContainers.orValue([])"
  validations:
    # Only NET_BIND_SERVICE allowed - blocks SYS_ADMIN, CAP_SYS_ADMIN, sys_admin, etc.
    - message: "FORTRESS SECURITY: Containers cannot add Linux capabilities (only NET_BIND_SERVICE is allowed)."
      expression: >
        variables.allContainers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.capabilities) ||
          !has(c.securityContext.capabilities.add) ||
          c.securityContext.capabilities.add.all(cap,
            cap.upperAscii() in ['NET_BIND_SERVICE', 'CAP_NET_BIND_SERVICE']
          )
        )
    # Block only when set to true - apps that don't set it still work
    - message: "FORTRESS SECURITY: Containers cannot set allowPrivilegeEscalation: true."
      expression: >
        variables.allContainers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.allowPrivilegeEscalation) ||
          c.securityContext.allowPrivilegeEscalation == false
        )
