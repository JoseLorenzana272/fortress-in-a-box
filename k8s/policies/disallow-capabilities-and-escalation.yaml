apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-capabilities-and-escalation
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: exclude-system-namespaces
      expression: "request.namespace != 'falco' && request.namespace != 'monitoring' && request.namespace != 'kyverno' && request.namespace != 'argocd' && !request.namespace.startsWith('gke-managed-') && request.namespace != 'gmp-system' && request.namespace != 'gmp-public'"
    # Namespaces added with "fortress allow" - not for what user apps deploy through Argo CD
    # Optional syntax (object.?metadata) on purpose: autogen rewrites object.metadata to the pod template
    - name: skip-allowed-namespaces
      expression: >
        !(request.namespace in resource.Get('v1', 'configmaps', 'kyverno', 'fortress-exceptions').?data.orValue({}) &&
        (request.?userInfo.?username.orValue('') != 'system:serviceaccount:argocd:argocd-application-controller' ||
        (object.?metadata.?annotations[?'argocd.argoproj.io/tracking-id'].orValue('') == '' ? 'fortress-user-workloads' :
        resource.Get('argoproj.io/v1alpha1', 'applications', 'argocd', object.?metadata.?annotations[?'argocd.argoproj.io/tracking-id'].orValue('').split(':')[0]).?spec.?project.orValue('fortress-user-workloads')) != 'fortress-user-workloads'))
  # Debug containers (kubectl debug) are checked in disallow-insecure-ephemeral-containers
  variables:
    - name: allContainers
      expression: "object.spec.containers + object.spec.?initContainers.orValue([])"
    # Kubernetes allows escalation when the field is not set
    - name: escalating
      expression: >
        variables.allContainers.filter(c, c.?securityContext.?allowPrivilegeEscalation.orValue(true) != false)
  validations:
    # Only NET_BIND_SERVICE allowed - blocks SYS_ADMIN, CAP_SYS_ADMIN, sys_admin, etc.
    - message: "FORTRESS SECURITY: Containers cannot add Linux capabilities (only NET_BIND_SERVICE is allowed)."
      expression: >
        variables.allContainers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.capabilities) ||
          !has(c.securityContext.capabilities.add) ||
          c.securityContext.capabilities.add.all(cap,
            cap.upperAscii() in ['NET_BIND_SERVICE', 'CAP_NET_BIND_SERVICE']
          )
        )
    # Must be false - setuid programs like su or sudo would let the container become root
    - expression: "size(variables.escalating) == 0"
      message: "FORTRESS SECURITY: Containers must set securityContext.allowPrivilegeEscalation: false."
      messageExpression: >
        (size(variables.escalating) == 1 ? 'FORTRESS SECURITY: Container "' : 'FORTRESS SECURITY: Containers "') +
        variables.escalating.map(c, c.name).join('", "') +
        '" must set securityContext.allowPrivilegeEscalation: false.'
