name: Checks
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  namespaces:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Platform namespaces match in every file
        run: .github/scripts/check-namespaces.sh
