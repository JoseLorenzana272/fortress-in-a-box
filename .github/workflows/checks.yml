name: Checks
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  namespaces:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Platform namespaces match in every file
        run: .github/scripts/check-namespaces.sh
